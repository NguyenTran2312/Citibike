# Local development stack for scope.md. See infra/README.md for job entry points.
name: citibike

# Config files are bind-mounted as directories, never as single files: Docker
# Desktop on WSL keeps a mount pointing at the old path once git rewrites a file
# or deletes/recreates a directory (pull/switch/rebase), and the container then
# fails to start with "error mounting ... no such file or directory". One-shot
# init jobs restart on every `up`, so they mount the whole ./infra directory,
# which exists on every branch. If a long-running service hits this error after
# a branch switch: docker compose up -d --force-recreate

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-citibike}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-citibike-local-secret}
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: 'true'
  S3_ENDPOINT_URL: http://minio:9000
  RAW_BUCKET: raw
  WAREHOUSE_BUCKET: warehouse
  CHECKPOINT_BUCKET: checkpoints
  QUARANTINE_BUCKET: quarantine
  PYTHONPATH: /app
  TZ: UTC

# Compose labels each built image with the building service's name, so if several
# services build the same tag they overwrite each other and every `up --build`
# recreates them. Each image is therefore built by exactly one service per profile
# (python: gbfs-poller / one-shot tools; spark: spark-master); the rest reuse it.
x-python-build: &python-build
  context: ./infra/python
  provenance: false

x-app: &app
  image: citibike/python:local
  pull_policy: never
  working_dir: /app
  init: true
  networks: [citibike]
  volumes:
    - ./ingestion:/app/ingestion:ro
    - ./serving:/app/serving:ro
    - ./models:/app/models
    - ./infra/dbt:/app/profiles:ro

x-spark: &spark
  image: citibike/spark:3.5.6-local
  pull_policy: never
  user: '0:0'
  init: true
  networks: [citibike]
  environment: &spark-env
    <<: *s3-env
    PYTHONPATH: /opt/project
    PYSPARK_PYTHON: python3
    PYSPARK_DRIVER_PYTHON: python3
  volumes:
    - ./infra/spark:/opt/spark/conf:ro
    - ./batch:/opt/project/batch:ro
    - ./streaming:/opt/project/streaming:ro
    - ./tests:/opt/project/tests:ro
    - spark-ivy:/root/.ivy2

x-airflow: &airflow
  image: apache/airflow:2.10.5-python3.11
  profiles: [airflow]
  user: '${AIRFLOW_UID:-50000}:0'
  init: true
  restart: unless-stopped
  networks: [citibike]
  environment: &airflow-env
    <<: *s3-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow-local-secret}@airflow-db:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-citibike-local-airflow-webserver-key}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
  volumes:
    - ./infra/airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs

services:
  minio:
    # MinIO stopped publishing minio/minio images. Bitnami legacy builds of the same
    # release (commit 0d7408f, RELEASE.2025-04-22T22-12-26Z) are frozen and versioned.
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2025.4.22}
    entrypoint: [minio]
    command: [server, /bitnami/minio/data, --address, ':9000', --console-address, ':9001']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-citibike}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-citibike-local-secret}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes: [minio-data:/bitnami/minio/data]
    networks: [citibike]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: ${MINIO_MC_IMAGE:-bitnamilegacy/minio-client:2025.4.16}
    restart: 'no'
    depends_on:
      minio: {condition: service_healthy}
    environment:
      <<: *s3-env
      MC_CONFIG_DIR: /tmp/.mc
    networks: [citibike]
    volumes:
      - ./infra:/infra:ro
    entrypoint: [/bin/sh, /infra/minio/init_buckets.sh]

  catalog-volume-init:
    image: busybox:1.37.0
    user: '0:0'
    restart: 'no'
    command: [chown, '1000:1000', /catalog]
    volumes: [catalog-data:/catalog]
    networks: [citibike]

  iceberg-rest:
    # Official development fixture, pinned to the digest verified with this stack.
    image: ${ICEBERG_REST_IMAGE:-apache/iceberg-rest-fixture@sha256:009f9f6897cc1e8fd6e8133c401c7a3e7c333c71293a621d06a71570ae989c29}
    restart: unless-stopped
    depends_on:
      minio-init: {condition: service_completed_successfully}
      catalog-volume-init: {condition: service_completed_successfully}
    environment:
      <<: *s3-env
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: 'jdbc:sqlite:/catalog/iceberg.db?journal_mode=WAL'
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
    volumes: [catalog-data:/catalog]
    ports: ['127.0.0.1:${ICEBERG_REST_PORT:-8181}:8181']
    networks: [citibike]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8181/v1/config]
      interval: 10s
      timeout: 5s
      retries: 18

  catalog-init:
    image: ${CURL_IMAGE:-curlimages/curl:8.11.1}
    restart: 'no'
    depends_on:
      iceberg-rest: {condition: service_healthy}
    environment:
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_NAMESPACES: bronze silver gold
    volumes:
      - ./infra:/infra:ro
    entrypoint: [/bin/sh, /infra/iceberg/init_namespaces.sh]
    networks: [citibike]

  kafka:
    image: apache/kafka:3.9.1
    user: '0:0'
    hostname: kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes: [kafka-data:/var/lib/kafka/data]
    ports: ['127.0.0.1:${KAFKA_PORT:-9092}:9092']
    networks: [citibike]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:29092, --list]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    restart: 'no'
    depends_on:
      kafka: {condition: service_healthy}
    networks: [citibike]
    volumes:
      - ./infra:/infra:ro
    entrypoint: [/bin/bash, /infra/kafka/init_topics.sh]

  postgres:
    image: postgres:16.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citibike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citibike-local-secret}
      POSTGRES_DB: citibike
      TZ: UTC
      PGTZ: UTC
    command: [postgres, -c, timezone=UTC]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    networks: [citibike]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d citibike']
      interval: 10s
      timeout: 5s
      retries: 10

  spark-master:
    <<: *spark
    build:
      context: ./infra/spark
      provenance: false
    pull_policy: build
    hostname: spark-master
    restart: unless-stopped
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.master.Master, --host, spark-master, --port, '7077', --webui-port, '8080']
    ports: ['127.0.0.1:${SPARK_UI_PORT:-8081}:8080']
    healthcheck:
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/spark-master/7077"']
      interval: 10s
      timeout: 5s
      retries: 12

  spark-worker:
    <<: *spark
    restart: unless-stopped
    depends_on:
      spark-master: {condition: service_healthy}
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.worker.Worker, --cores, '${SPARK_WORKER_CORES:-2}', --memory, '${SPARK_WORKER_MEMORY:-4g}', --webui-port, '8081', 'spark://spark-master:7077']
    ports: ['127.0.0.1:${SPARK_WORKER_UI_PORT:-8082}:8081']

  trino:
    image: trinodb/trino:484
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-citibike}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-citibike-local-secret}
    depends_on:
      catalog-init: {condition: service_completed_successfully}
    volumes:
      - ./infra/trino:/etc/trino:ro
    ports: ['127.0.0.1:${TRINO_PORT:-8080}:8080']
    networks: [citibike]
    healthcheck:
      test: [CMD, /usr/lib/trino/bin/health-check]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  grafana:
    image: grafana/grafana:12.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafana-local-secret}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PLUGINS_PREINSTALL_SYNC: trino-datasource
      POSTGRES_USER: ${POSTGRES_USER:-citibike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citibike-local-secret}
    depends_on:
      postgres: {condition: service_healthy}
      trino: {condition: service_healthy}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:${GRAFANA_PORT:-3000}:3000']
    networks: [citibike]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Airflow is INF-09: start with `docker compose --profile airflow up -d`.
  airflow-db:
    image: postgres:16.6-bookworm
    profiles: [airflow]
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow-local-secret}
      POSTGRES_DB: airflow
    volumes: [airflow-db-data:/var/lib/postgresql/data]
    networks: [citibike]
    healthcheck:
      test: [CMD, pg_isready, -U, airflow, -d, airflow]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    restart: 'no'
    depends_on:
      airflow-db: {condition: service_healthy}
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-airflow-local-secret}
    command: version

  airflow-webserver:
    <<: *airflow
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    command: webserver
    ports: ['127.0.0.1:${AIRFLOW_PORT:-8083}:8080']
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    command: scheduler
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 20s
      timeout: 10s
      retries: 10

  # Application entry points are contracts for code to be added by the team.
  gbfs-poller:
    <<: *app
    build: *python-build
    pull_policy: build
    profiles: [pipeline]
    restart: unless-stopped
    # On SIGTERM the poller stops retrying GBFS but finishes a poll it already fetched:
    # Kafka flush (<= 35 s) + MinIO upload (<= ~60 s). A poll cut off later is kept in
    # gbfs-spool for --replay (tests/integration/test_poller_shutdown.py).
    stop_grace_period: 120s
    command: [python, -m, ingestion.gbfs.poller]
    environment:
      <<: *s3-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GBFS_DISCOVERY_URL: https://gbfs.lyft.com/gbfs/2.3/bkn/gbfs.json
      POLL_INTERVAL_SECONDS: '60'
      INFORMATION_POLL_INTERVAL_SECONDS: '86400'
      GBFS_PUBLISH_KAFKA: 'true'
      GBFS_ARCHIVE_RAW: 'true'
      GBFS_STATUS_TOPIC: gbfs.station_status
      GBFS_INFORMATION_TOPIC: gbfs.station_information
      GBFS_INVALID_TOPIC: gbfs.invalid
    # Replaces the x-app mount list (YAML merge does not append lists); the poller only
    # needs ingestion/. Poll directories kept for --replay must survive a recreated container.
    volumes:
      - ./ingestion:/app/ingestion:ro
      - gbfs-spool:/app/data
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}

  latest-state-consumer:
    <<: *app
    profiles: [pipeline]
    # Fail fast and let Docker restart with backoff (100 ms doubling, capped at 1 min). Offsets are
    # committed only after the PostgreSQL write, so a restart replays into an idempotent UPSERT.
    restart: unless-stopped
    command: [python, -m, serving.latest_state_consumer]
    environment:
      TZ: UTC
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: citibike-postgres-latest
      GBFS_STATUS_TOPIC: gbfs.station_status
      GBFS_INVALID_TOPIC: gbfs.invalid
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: citibike
      PGUSER: ${POSTGRES_USER:-citibike}
      PGPASSWORD: ${POSTGRES_PASSWORD:-citibike-local-secret}
      LOW_BIKES_THRESHOLD: ${LOW_BIKES_THRESHOLD:-2}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-180}
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}

  spark-streaming:
    <<: *spark
    profiles: [pipeline]
    hostname: spark-streaming
    # Offsets and progress live in the checkpoints, so a restart resumes where the
    # queries stopped; keep restarting (on-failure:5 gave up after a few seconds).
    restart: unless-stopped
    environment:
      <<: *spark-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: citibike-iceberg-history
      GBFS_STATUS_TOPIC: gbfs.station_status
      GBFS_INFORMATION_TOPIC: gbfs.station_information
      STATUS_CHECKPOINT_LOCATION: s3a://checkpoints/status-history/
      INFORMATION_CHECKPOINT_LOCATION: s3a://checkpoints/information-history/
      SILVER_STATUS_CHECKPOINT_LOCATION: s3a://checkpoints/silver-status/
      SILVER_INFORMATION_CHECKPOINT_LOCATION: s3a://checkpoints/silver-information/
      STREAM_TRIGGER_INTERVAL: ${STREAM_TRIGGER_INTERVAL:-5 minutes}
      # Must exceed the messages arriving per trigger (status ~12600 per 5 minutes).
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-100000}
      # true: stop when Kafka no longer has offsets a checkpoint needs (streaming/README.md)
      FAIL_ON_DATA_LOSS: ${FAIL_ON_DATA_LOSS:-true}
    entrypoint: [/opt/spark/bin/spark-submit]
    command: [--master, 'spark://spark-master:7077', --deploy-mode, client, --conf, spark.driver.host=spark-streaming, --conf, spark.driver.bindAddress=0.0.0.0, /opt/project/streaming/jobs/gbfs_history.py]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      catalog-init: {condition: service_completed_successfully}
      spark-master: {condition: service_healthy}
      spark-worker: {condition: service_started}

  spark-batch: &batch-job
    <<: *spark
    profiles: [tools]
    hostname: spark-batch
    environment:
      <<: *spark-env
      TRIP_TIMEZONE: America/New_York
      TRIP_START_MONTH: '2026-01'
      TRIP_END_MONTH: '2026-10'
    entrypoint: [/opt/spark/bin/spark-submit]
    command: [--master, 'spark://spark-master:7077', --deploy-mode, client, --conf, spark.driver.host=spark-batch, --conf, spark.driver.bindAddress=0.0.0.0, /opt/project/batch/jobs/trips_bronze.py]
    depends_on:
      catalog-init: {condition: service_completed_successfully}
      spark-master: {condition: service_healthy}
      spark-worker: {condition: service_started}

  spark-batch-silver:
    <<: *batch-job
    hostname: spark-batch-silver
    command: [--master, 'spark://spark-master:7077', --deploy-mode, client, --conf, spark.driver.host=spark-batch-silver, --conf, spark.driver.bindAddress=0.0.0.0, /opt/project/batch/jobs/trips_silver.py]

  dbt:
    <<: *app
    build: *python-build
    pull_policy: build
    profiles: [tools]
    working_dir: /app/models/dbt
    entrypoint: [dbt]
    command: [debug, --profiles-dir, /app/profiles]
    environment:
      DBT_PROFILES_DIR: /app/profiles
    depends_on:
      trino: {condition: service_healthy}

  trip-downloader:
    <<: *app
    build: *python-build
    pull_policy: build
    profiles: [tools]
    command: [python, -m, ingestion.trip_history.downloader]
    environment:
      <<: *s3-env
      TRIP_START_MONTH: '2026-01'
      TRIP_END_MONTH: '2026-10'
    depends_on:
      minio-init: {condition: service_completed_successfully}

  latest-state-reconciliation:
    <<: *app
    build: *python-build
    pull_policy: build
    profiles: [tools]
    command: [python, -m, serving.reconcile_latest_state]
    environment:
      <<: *s3-env
      TRINO_HOST: trino
      TRINO_PORT: '8080'
      TRINO_USER: reconciliation
      TRINO_CATALOG: iceberg
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: citibike
      PGUSER: ${POSTGRES_USER:-citibike}
      PGPASSWORD: ${POSTGRES_PASSWORD:-citibike-local-secret}
      LOW_BIKES_THRESHOLD: ${LOW_BIKES_THRESHOLD:-2}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-180}
    depends_on:
      postgres: {condition: service_healthy}
      trino: {condition: service_healthy}

networks:
  citibike:
    driver: bridge

volumes:
  minio-data:
  catalog-data:
  kafka-data:
  postgres-data:
  spark-ivy:
  grafana-data:
  airflow-db-data:
  airflow-logs:
  gbfs-spool:
